spring:
  application:
    name: zaccounting-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true
      "[mail.smtp.timeout]": 3000
      "[mail.smtp.writetimeout]": 3000
logging:
  pattern:
    level: "%5p [requestId:%X{requestId}]"
app:
  security:
    session-cookie-name: ${AUTH_SESSION_COOKIE_NAME:zaccounting_session}
    session-cookie-secure: ${AUTH_COOKIE_SECURE:true}
    rate-limit-pepper: ${AUTH_RATE_LIMIT_PEPPER:}
    public-origin: ${PUBLIC_ORIGIN:http://localhost:3000}
    frontend-url: ${FRONTEND_URL:http://localhost:3000}
    trusted-proxy-cidrs: ${TRUSTED_PROXY_CIDRS:}
    outbox-encryption-key: ${AUTH_OUTBOX_ENCRYPTION_KEY:}
  auth-mail:
    poll-interval: ${AUTH_MAIL_POLL_INTERVAL:2000}
  mail:
    from: ${MAIL_FROM:}
